<!DOCTYPE html>

<head>
  <title>Hangbag!</title>
  <script type="module">
    import { Nostalgist } from 'https://esm.run/nostalgist'
    const instance = await Nostalgist.nes({
      rom: 'hangbag',
      resolveRom() {
        const b64rom = '%HANGBAG_ROM%';
        const binary = Uint8Array.from(atob(b64rom), c => c.charCodeAt(0));
        const stream = new Response(binary).body;
        const decompressedStream = stream.pipeThrough(new DecompressionStream('gzip'));
        return new Response(decompressedStream).arrayBuffer();
      },
      runEmulatorManually: true,
    });

  const start = document.getElementById("start");
  start.onclick = async () => await instance.launchEmulator();
  start.style.display = 'block';
  </script>
</head>
<body>
  Please wait for the emulator to load. Hit F1 to open emulator settings during playtime.
  <br><button id="start" style="display: none;">Start Game</button>
</body>
